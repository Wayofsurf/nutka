<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nutka – nauka gry na pianinie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=Noto+Music&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12112a; --bg2:#1a1840; --card:#232150; --card2:#2c2a5e; --line:#33316a;
  --ink:#f5f3ff; --mut:#a7a4d4; --acc:#ff7a59; --acc2:#ffb547; --good:#33d496; --bad:#ff5470;
  --rh:#4f86ff; --lh:#ff9f2e; --paper:#fbf8f1; --paperInk:#1d1b36;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,.disp{font-family:"Baloo 2",Nunito,sans-serif;margin:0;line-height:1.1}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.screens{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 14px) calc(var(--sar) + 16px) 28px calc(var(--sal) + 16px)}
.screen{display:none;max-width:640px;margin:0 auto}
.screen.on{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabbar{display:flex;background:#16143a;border-top:1px solid var(--line);padding:6px calc(var(--sar) + 8px) calc(var(--sab) + 6px) calc(var(--sal) + 8px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mut);font-weight:800;font-size:12px;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--acc)}

/* header */
.topRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:8px;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:26px}
.logo i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#ff4f8b);font-style:normal;font-size:19px}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:5px;background:var(--card);padding:6px 11px;border-radius:999px;font-weight:800;font-size:14px}
.hero{background:linear-gradient(140deg,#3b2f8f,#6b2fa0 60%,#a63d8f);border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;margin-bottom:22px}
.hero:after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Baloo 2",Nunito,sans-serif;font-size:19px;line-height:1;text-align:center}
.ring b small{display:block;font-family:Nunito,sans-serif;font-size:10px;color:#e8defc;font-weight:700}
.hero .t{flex:1;min-width:0;position:relative;z-index:1}
.hero .lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#f3d9ff;opacity:.9}
.hero h2{font-size:21px;margin:3px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;padding:12px 20px;border-radius:16px;box-shadow:0 4px 0 #c94f33;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c94f33}
.btn.ghost{background:var(--card2);box-shadow:0 4px 0 #1b1946}
.btn.ghost:active{box-shadow:0 1px 0 #1b1946}
.btn.good{background:var(--good);box-shadow:0 4px 0 #1f9a6b;color:#08261a}
.btn.white{background:#fff;color:#3a2a8a;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.secTitle{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 12px}
.secTitle h3{font-size:21px}
.secTitle span{color:var(--mut);font-size:13px;font-weight:700}

.course{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:20px;background:var(--card);margin-bottom:12px;position:relative;overflow:hidden}
.course .ic{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:28px;flex:none}
.course .meta{flex:1;min-width:0}
.course h4{margin:0;font-family:"Baloo 2",Nunito,sans-serif;font-size:18px}
.course p{margin:1px 0 8px;color:var(--mut);font-size:13px;font-weight:700}
.bar{height:8px;border-radius:9px;background:#15133a;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--good);transition:width .4s}
.arrow{color:var(--mut);font-size:22px}

/* course path */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:800;margin-bottom:10px;padding:6px 0}
.cHead{border-radius:24px;padding:20px;margin-bottom:10px}
.cHead h2{font-size:26px}
.cHead p{margin:4px 0 0;font-weight:700;opacity:.9}
.path{position:relative;padding:18px 0 40px}
.node{display:flex;flex-direction:column;align-items:center;margin:0 auto 18px;width:150px;position:relative}
.node .c{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:"Baloo 2",Nunito,sans-serif;font-size:28px;font-weight:800;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.node.locked .c{background:#2a2858 !important;color:#5d5a96;box-shadow:0 6px 0 #1b1946}
.node.cur .c:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid currentColor;opacity:.6;animation:pulse 1.6s infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.18);opacity:0}}
.node .nm{margin-top:12px;font-weight:800;font-size:14px;text-align:center;line-height:1.2}
.node .st{font-size:15px;letter-spacing:1px;margin-top:2px;height:18px}
.st .off{opacity:.22;filter:grayscale(1)}

/* songs */
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-weight:800;font-size:14px;color:var(--mut)}
.fchip.on{background:var(--ink);color:var(--bg)}
.song{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px;border-radius:18px;background:var(--card);margin-bottom:10px}
.cover{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);right:-12px;bottom:-14px}
.song .meta{flex:1;min-width:0}
.song h4{margin:0;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song p{margin:2px 0 0;color:var(--mut);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;display:inline-block;margin-top:5px}
.lvl.e{background:rgba(51,212,150,.15);color:var(--good)}
.lvl.m{background:rgba(255,181,71,.15);color:var(--acc2)}
.lvl.h{background:rgba(255,84,112,.15);color:#ff7d93}
.song .st{font-size:13px;white-space:nowrap}

/* profile */
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat b{display:block;font-family:"Baloo 2",Nunito,sans-serif;font-size:28px;line-height:1}
.stat span{color:var(--mut);font-weight:700;font-size:13px}
.set{background:var(--card);border-radius:18px;padding:4px 14px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{font-weight:800;font-size:15px}
.row .l small{display:block;color:var(--mut);font-weight:700;font-size:12px;margin-top:2px}
.seg{display:flex;background:#16143a;border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{padding:7px 10px;border-radius:9px;font-weight:800;font-size:13px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--ink)}
.tog{width:50px;height:30px;border-radius:30px;background:#3a3870;position:relative;flex:none;transition:background .2s}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--good)}
.tog.on:after{transform:translateX(20px)}
input[type=range]{accent-color:var(--acc);width:130px}
.note{color:var(--mut);font-size:13px;font-weight:700;line-height:1.45;padding:2px 4px 18px}
.danger{color:var(--bad);font-weight:800;padding:12px 0}

/* ================= PLAYER ================= */
#player{position:fixed;inset:0;background:#0f0e24;display:none;flex-direction:column;z-index:20}
#player.on{display:flex}
.pTop{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) 8px calc(var(--sal) + 12px);background:#0f0e24}
.iconBtn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;flex:none}
.iconBtn svg{width:20px;height:20px}
.micBtn{position:relative;transition:background .2s}
.micBtn.on{background:var(--good);color:#08261a;box-shadow:0 0 0 calc(var(--lvl,0)*7px) rgba(51,212,150,.35)}
.micBtn.err{color:var(--bad)}
.micBtn.err:after{content:"";position:absolute;width:24px;height:2.5px;background:var(--bad);transform:rotate(-45deg);border-radius:2px}
.micRead{display:flex;align-items:center;gap:10px}
.micRead b{font-family:"Baloo 2",Nunito,sans-serif;font-size:22px;min-width:44px;text-align:right}
.micRead .bar{width:90px}
.micRead .bar i{transition:none}
.pTitle{flex:1;min-width:0}
.pTitle b{display:block;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pTitle .bar{height:7px;margin-top:5px}
.pTitle .bar i{background:linear-gradient(90deg,var(--good),#7ef0c2);transition:width .15s linear}
.stage{flex:1;position:relative;min-height:120px;margin:0 calc(var(--sar) + 8px) 0 calc(var(--sal) + 8px);border-radius:18px;overflow:hidden;background:var(--paper)}
#sheetCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.fb{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:22px;color:var(--paperInk);pointer-events:none;opacity:0;white-space:nowrap}
.fb.show{animation:fbPop .9s ease forwards}
@keyframes fbPop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.hintPill{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(29,27,54,.85);color:#fff;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.pStats{display:flex;gap:10px;font-weight:800;font-size:13px;color:var(--mut)}
.pStats b{color:var(--ink);margin-left:3px}
.pBarX{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);color:var(--mut);font-weight:800;font-size:12px}
.pBar .combo{display:flex;gap:12px}
.pBar .combo b{color:var(--ink)}
.midiTag{color:var(--good);font-size:11px}
.stage{margin-bottom:8px!important}

/* keyboard */
.kbWrap{height:var(--kbh,200px);overflow-x:auto;overflow-y:hidden;padding:0 calc(var(--sar)) calc(var(--sab) + 4px) calc(var(--sal));background:#0f0e24;scrollbar-width:none}
.kbWrap::-webkit-scrollbar{display:none}
#kb{position:relative;height:100%;touch-action:none;margin:0 auto}
.wk,.bk{position:absolute;top:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-weight:800}
.wk{height:100%;background:linear-gradient(#f2f0fa,#fff 12%);border:1px solid #c9c6dd;border-top:0;border-radius:0 0 9px 9px;color:#8a87a8;font-size:12px;padding-bottom:8px;box-shadow:inset 0 -6px 0 #dcd9ea}
.bk{height:61%;background:linear-gradient(#2a2840,#14132a);border-radius:0 0 6px 6px;z-index:2;box-shadow:inset 0 -5px 0 #050414,0 2px 3px rgba(0,0,0,.4)}
.wk.tR,.bk.tR{background:var(--rh);color:#fff;box-shadow:inset 0 -6px 0 #2c5fd6}
.wk.tL,.bk.tL{background:var(--lh);color:#fff;box-shadow:inset 0 -6px 0 #c9740f}
.wk.prev{background:linear-gradient(#e9efff,#d6e2ff);color:#2c5fd6}
.wk.dn{background:#e3e0f2;box-shadow:inset 0 -2px 0 #c9c6dd}
.bk.dn{background:#3d3a5c;box-shadow:inset 0 -2px 0 #050414}
.wk.good,.bk.good{background:var(--good)!important;color:#08261a!important;box-shadow:inset 0 -2px 0 #1f9a6b!important}
.wk.bad,.bk.bad{background:var(--bad)!important;color:#fff!important;box-shadow:inset 0 -2px 0 #b9213d!important}
.wk.auto,.bk.auto{background:#b9b5e0!important;box-shadow:inset 0 -2px 0 #8b87bd!important}
.wk .dot{width:8px;height:8px;border-radius:50%;background:currentColor;margin-bottom:6px;opacity:.9}
.rot{position:absolute;right:10px;top:10px;background:rgba(29,27,54,.85);color:#fff;font-size:11px;font-weight:800;padding:5px 9px;border-radius:9px;pointer-events:none}

/* sheets (dialogs) */
.dlg{position:absolute;inset:0;background:rgba(15,14,36,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:10px;z-index:5}
.dlg.on{display:flex}
.card{background:var(--bg2);border-radius:24px;padding:20px;width:100%;max-width:440px;max-height:100%;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.card .kick{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--acc2)}
.card h2{font-size:24px;margin:4px 0 8px}
.card p{margin:0 0 14px;color:#d9d6f5;font-weight:700;line-height:1.45;font-size:15px}
.card .btns{display:flex;gap:10px;margin-top:6px}
.card .btns .btn{flex:1}
.card .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.card .opt>span{font-weight:800;font-size:14px;color:var(--mut)}
.stepper{display:flex;align-items:center;gap:6px;background:#16143a;border-radius:12px;padding:3px}
.stepper button{width:32px;height:30px;border-radius:9px;background:var(--card2);font-weight:800;font-size:18px}
.stepper b{min-width:52px;text-align:center;font-size:14px}
.bigStars{display:flex;justify-content:center;gap:10px;font-size:46px;margin:6px 0 4px}
.bigStars span{opacity:.18;filter:grayscale(1);transform:scale(.7);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.bigStars span.on{opacity:1;filter:none;transform:scale(1)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.res div{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center}
.res b{display:block;font-family:"Baloo 2",Nunito,sans-serif;font-size:22px;line-height:1.1}
.res span{font-size:11px;color:var(--mut);font-weight:800}
.center{text-align:center}
.confirm{position:fixed;inset:0;background:rgba(10,9,26,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.confirm.on{display:flex}
.workout{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:20px;background:linear-gradient(135deg,#1f4b47,#1d3157);margin:-8px 0 22px;border:1px solid rgba(51,212,150,.35)}
.workout .wi{width:50px;height:50px;border-radius:15px;background:rgba(51,212,150,.18);display:grid;place-items:center;font-size:26px;flex:none}
.workout h4{margin:0;font-family:"Baloo 2",Nunito,sans-serif;font-size:18px}.workout p{margin:0;color:var(--mut);font-weight:700;font-size:13px}.workout .meta{flex:1}
.carousel{display:flex;gap:12px;overflow-x:auto;margin:0 -16px 20px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.scard{flex:none;width:138px;text-align:left;scroll-snap-align:start}
.scard .art{width:138px;height:138px;border-radius:22px;display:grid;place-items:center;font-size:56px;position:relative;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.scard .art:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12);right:-30px;bottom:-34px}
.scard .lv{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;background:rgba(0,0,0,.35);padding:3px 7px;border-radius:7px}
.scard .done{position:absolute;right:8px;bottom:6px;font-size:13px;color:#ffd166;z-index:1}
.scard h5{margin:9px 2px 0;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard p{margin:1px 2px 0;font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border-radius:24px;padding:18px;margin-bottom:22px;position:relative;overflow:hidden}
.feat .fi{font-size:64px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.feat h2{font-size:22px;margin:2px 0 2px}.feat p{margin:0 0 10px;font-weight:700;opacity:.85;font-size:13px}
.feat .kick{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.feat .btn{padding:9px 16px;font-size:14px}
.songHero{border-radius:26px;padding:22px 18px;text-align:center;margin-bottom:18px}
.songHero .big{font-size:70px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.songHero h2{font-size:26px;margin:8px 0 2px}.songHero p{margin:0;font-weight:700;opacity:.85}
.heroMeta{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0 14px}.heroMeta .lvl{margin:0;background:rgba(0,0,0,.3)}
.part{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;background:var(--card);margin-bottom:10px}
.part .pn{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:18px;flex:none}
.part .meta{flex:1}.part h4{margin:0;font-size:16px;font-weight:800}.part p{margin:1px 0 0;color:var(--mut);font-size:13px;font-weight:700}.part .st{font-size:13px}
.part.full{background:linear-gradient(135deg,#3b2f8f,#6b2fa0)}.part.full .pn{background:rgba(255,255,255,.15)}
.part.locked{opacity:.5}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.onb{position:fixed;inset:0;z-index:60;display:none;background:radial-gradient(120% 80% at 50% 0%,#3a2a8f 0%,#12112a 60%);overflow-y:auto}
.onb.on{display:block}
.onbIn{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(var(--sat) + 18px) 20px calc(var(--sab) + 22px)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}.dots i{width:28px;height:5px;border-radius:5px;background:rgba(255,255,255,.18)}.dots i.on{background:var(--acc)}
.onbBody{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fadeIn .3s ease}
.onbBody .em{font-size:72px;text-align:center;line-height:1.1}
.onbBody h1{font-size:30px;text-align:center;margin:10px 0 8px}
.onbBody>p{text-align:center;color:#d9d6f5;font-weight:700;line-height:1.45;margin:0 0 18px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:18px;background:rgba(255,255,255,.07);border:2px solid transparent;margin-bottom:10px}

   STORAGE
   ========================================================= */
const store={
  get(k,d){try{const v=localStorage.getItem('nutka:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('nutka:'+k,JSON.stringify(v))}catch(e){}}
};
let progress=store.get('progress',{});
let settings=Object.assign({names:'letters',kbLabels:true,hints:true,volume:0.8,mic:false,sens:1.4,onboarded:false,gapMs:300,instrument:'screen',level:'zero',goalMin:5,midi:false,midiSound:false,drums:true},store.get('settings',{}));
let stats=Object.assign({streak:0,lastDay:null,notes:0,seconds:0,todaySec:0,today:null,lessons:0},store.get('stats',{}));
const dayKey=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function rollDay(){const k=dayKey();if(stats.today!==k){stats.today=k;stats.todaySec=0}
  if(stats.lastDay){const y=new Date();y.setDate(y.getDate()-1);if(stats.lastDay!==k&&stats.lastDay!==dayKey(y))stats.streak=0}}
function markPractice(){const k=dayKey();if(stats.lastDay!==k){const y=new Date();y.setDate(y.getDate()-1);stats.streak=(stats.lastDay===dayKey(y)?stats.streak:0)+1;stats.lastDay=k}store.set('stats',stats)}
rollDay();

function songParts(s){
  const sp=x=>x.split('|').map(y=>y.trim());const R=s.R?sp(s.R):null,L=s.L?sp(s.L):null,n=(R||L).length,pk=s.pickup?1:0;
  if(n-pk<=6)return[];
  const ch=[];let i=pk;while(i<n){let e=Math.min(n,i+4);if(n-e>0&&n-e<3)e=n;ch.push([i,e]);i=e}
  return ch.map(([a,b],k)=>{const a2=k===0?0:a;return{key:s.id+'#'+(k+1),label:'Część '+(k+1),sub:`takty ${a-pk+1}–${b-pk}`,
    ex:{...s,R:R?R.slice(a2,b).join(' | '):undefined,L:L?L.slice(a2,b).join(' | '):undefined,pickup:k===0?(s.pickup||0):0}}});
}

/* =========================================================
   NOTES
   ========================================================= */
const LETTERS='CDEFGAB', BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const PLN={C:'C',D:'D',E:'E',F:'F',G:'G',A:'A',B:'H'};
const SOL={C:'do',D:'re',E:'mi',F:'fa',G:'sol',A:'la',B:'si'};
const SHARP_SPELL=[['C',0],['C',1],['D',0],['D',1],['E',0],['F',0],['F',1],['G',0],['G',1],['A',0],['A',1],['B',0]];
function parseNote(p){const m=/^([A-G])(#|b)?(-?\d)$/.exec(p);if(!m)throw new Error('Zła nuta: '+p);
  const L=m[1],acc=m[2]==='#'?1:m[2]==='b'?-1:0,oct=+m[3];return{midi:12*(oct+1)+BASE[L]+acc,dia:oct*7+LETTERS.indexOf(L),acc}}
function midiSpell(m){const [L,acc]=SHARP_SPELL[m%12];const oct=Math.floor(m/12)-1;return{midi:m,dia:oct*7+LETTERS.indexOf(L),acc}}
function noteLabel(n){const L=LETTERS[((n.dia%7)+7)%7];
  if(settings.names==='solfege')return SOL[L]+(n.acc>0?'♯':'');
  if(n.acc>0)return PLN[L]+'is';return PLN[L]}
function whiteLabel(m){const n=midiSpell(m);return n.acc?'':noteLabel(n)}
const isBlack=m=>[1,3,6,8,10].includes(m%12);

function buildPiece(ex){
  const notes=[];let len=0;
  for(const hand of ['R','L']){if(!ex[hand])continue;let t=0;
    for(const tok of ex[hand].trim().split(/\s+/)){if(tok==='|'||!tok)continue;
      const [n,ds]=tok.split(':');const d=ds?parseFloat(ds):1;
      if(n!=='r')for(const p of n.split('+'))notes.push({...parseNote(p),t,d,hand});
      t+=d}
    len=Math.max(len,t)}
  notes.sort((a,b)=>a.t-b.t||a.midi-b.midi);
  return{notes,len,ts:ex.ts||4,pickup:ex.pickup||0,bpm:ex.bpm||90,hands:{R:!!ex.R,L:!!ex.L}};
}

/* =========================================================
   SYNTH (Web Audio piano)
   ========================================================= */
const Synth={ctx:null,master:null,wave:null,voices:new Map(),
  ensure(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return true}
    try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC()}catch(e){return false}
    const c=this.ctx;this.master=c.createGain();this.master.gain.value=settings.volume;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
    this.master.connect(comp);comp.connect(c.destination);
    try{const conv=c.createConvolver(),len=Math.floor(c.sampleRate*1.8),buf=c.createBuffer(2,len,c.sampleRate);
      for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
      conv.buffer=buf;const wet=c.createGain();wet.gain.value=0.16;this.master.connect(conv);conv.connect(wet);wet.connect(comp)}catch(e){}
    const imag=new Float32Array([0,1,0.46,0.24,0.15,0.08,0.05,0.03,0.02]);
    this.wave=c.createPeriodicWave(new Float32Array(imag.length),imag);
    return true},
  setVol(v){if(this.master)this.master.gain.value=v},
  noteOn(m,vel=0.85,dur=0){
    if(!this.ensure())return;const c=this.ctx,t=c.currentTime;
    if(!dur)this.noteOff(m);
    const f=440*Math.pow(2,(m-69)/12);
    const g=c.createGain(),flt=c.createBiquadFilter();
    const peak=vel*0.26*(m<52?1.25:1);
    const decay=Math.max(0.7,Math.min(3.4,3.4-(m-40)*0.05));
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+0.005);
    g.gain.setTargetAtTime(peak*0.4,t+0.006,0.09);g.gain.setTargetAtTime(0,t+0.12,decay/2.6);
    flt.type='lowpass';flt.Q.value=0.6;flt.frequency.setValueAtTime(Math.min(15000,f*11),t);
    flt.frequency.setTargetAtTime(Math.min(7000,f*3.2),t+0.01,0.35);
    const os=[-4,3].map(dt=>{const o=c.createOscillator();o.setPeriodicWave(this.wave);o.frequency.value=f;o.detune.value=dt;o.connect(flt);o.start(t);try{o.stop(t+decay*3)}catch(e){}return o});
    flt.connect(g);g.connect(this.master);
    const v={g,os};
    if(dur)this.release(v,t+dur);else this.voices.set(m,v);
  },
  release(v,t){const p=v.g.gain;
    if(p.cancelAndHoldAtTime)p.cancelAndHoldAtTime(t);else{const cur=p.value;p.cancelScheduledValues(t);p.setValueAtTime(cur,t)}
    p.setTargetAtTime(0,t,0.1);v.os.forEach(o=>{try{o.stop(t+0.9)}catch(e){}})},
  noteOff(m){const v=this.voices.get(m);if(!v||!this.ctx)return;this.voices.delete(m);this.release(v,this.ctx.currentTime)},
  allOff(){for(const m of [...this.voices.keys()])this.noteOff(m)},
  noise(){if(!this._nb){const c=this.ctx,b=c.createBuffer(1,Math.floor(c.sampleRate*0.3),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this._nb=b}return this._nb},
  bus(){if(!this._db){this._db=this.ctx.createGain();this._db.gain.value=0.33;this._db.connect(this.master)}return this._db},
  drum(kind,vel=1){if(!this.ensure())return;const c=this.ctx,t=c.currentTime+0.005;
    if(kind==='kick'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+0.15);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.95*vel,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+0.33);o.connect(g);g.connect(this.bus());o.start(t);o.stop(t+0.36);return}
    const n=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();n.buffer=this.noise();
    if(kind==='hat'){f.type='highpass';f.frequency.value=7500;g.gain.setValueAtTime(0.3*vel,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05)}
    else{f.type='bandpass';f.frequency.value=1900;f.Q.value=0.6;g.gain.setValueAtTime(0.55*vel,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.17)}
    n.connect(f);f.connect(g);g.connect(this.bus());n.start(t);n.stop(t+0.25)},
  click(accent,at){if(!this.ensure())return;const c=this.ctx,t=Math.max(c.currentTime,at),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=accent?1760:1180;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.003);g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+0.08)}
};
document.addEventListener('pointerdown',()=>Synth.ensure(),{passive:true});

}
function saveSettings(){store.set('settings',settings)}
function askConfirm(t,msg,ok,fn){const c=$('#confirm');$('#confirmCard').innerHTML=`<h2>${t}</h2><p>${msg}</p><div class="btns"><button class="btn ghost" id="cfN">Anuluj</button><button class="btn" id="cfY">${ok}</button></div>`;
  c.classList.add('on');$('#cfN').onclick=()=>c.classList.remove('on');$('#cfY').onclick=()=>{c.classList.remove('on');fn()}}
function renderAll(){renderHome();renderSongs();renderProfile()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='home')homeView=null;if(b.dataset.tab==='songs')songView=null;goTab(b.dataset.tab)});

/* =========================================================
   PLAYER
   ========================================================= */
const P={piece:null,mode:'wait',play:{R:true,L:true},tempo:1,notes:[],steps:[],groups:[],si:0,viewT:-1,running:false,
  t0:0,bps:1.5,countIn:0,stats:null,ghosts:[],lay:null,raf:0,last:0,kbLo:48,kbHi:72,targets:'',preview:[]};
let flow=null;
const cv=$('#sheetCv'),g2=cv.getContext('2d');let cw=0,ch=0,dpr=1;

function openPlayer(){$('#player').classList.add('on');P.last=performance.now();cancelAnimationFrame(P.raf);P.raf=requestAnimationFrame(loop);setKbHeight()}
function closePlayer(){stopRun();Synth.allOff();$('#player').classList.remove('on');cancelAnimationFrame(P.raf);flow=null;store.set('stats',stats);renderAll()}
$('#pClose').onclick=closePlayer;
$('#pPause').onclick=()=>{if(!flow)return;stopRun();Synth.allOff();showIntro()};

function loadPiece(piece,name){
  P.piece=piece;$('#pName').textContent=name;
  P.notes=piece.notes.map(n=>({...n,state:'pending',auto:false}));P.steps=[];P.viewT=-1;P.running=false;P.ghosts=[];
  // stem groups
  const gm=new Map();for(const n of P.notes){const k=n.t.toFixed(4)+n.hand;if(!gm.has(k))gm.set(k,[]);gm.get(k).push(n)}P.groups=[...gm.values()];
  let lo=Math.min(...piece.notes.map(n=>n.midi)),hi=Math.max(...piece.notes.map(n=>n.midi));
  while(!(lo%12===0||lo%12===5))lo--;while(!(hi%12===4||hi%12===11))hi++;
  let whites=0;for(let m=lo;m<=hi;m++)if(!isBlack(m))whites++;
  while(whites<10){hi++;if(!isBlack(hi))whites++}
  P.kbLo=lo;P.kbHi=hi;P.stats=null;buildKeyboard();resize();setStatsUI();setProg(0);
}
function stopRun(){P.running=false}
function startRun(mode){
  P.mode=mode;Synth.ensure();
  P.notes.forEach(n=>{n.state='pending';n.auto=(mode==='listen')||!P.play[n.hand];n.hitAt=0});
  const req=P.notes.filter(n=>!n.auto),sm=new Map();
  for(const n of req){const k=n.t.toFixed(4);if(!sm.has(k))sm.set(k,{t:n.t,notes:[],clean:true});sm.get(k).notes.push(n)}
  P.steps=[...sm.values()].sort((a,b)=>a.t-b.t);P.si=0;P.ghosts=[];
  P.stats={wrong:0,hit:0,clean:0,total:mode==='wait'?P.steps.length:req.length,combo:0,best:0};
  P.bps=P.piece.bpm*P.tempo/60;
  if(mode==='wait'){P.viewT=Math.min(0,P.steps[0]?P.steps[0].t:0)-1.2;hint('Zagraj podświetlony klawisz',2600)}
  else{P.countIn=Math.max(2,Math.round(P.piece.ts>=2?P.piece.ts:3));if(P.piece.pickup)P.countIn=Math.max(P.countIn,3);
    const now=Synth.ctx?Synth.ctx.currentTime:0;for(let i=0;i<P.countIn;i++)Synth.click(i===0,now+0.12+i/P.bps);
    P.t0=performance.now()+120;P.viewT=-P.countIn}
  P.lastHalf=-1;P.lastAcceptAt=0;P.lastPcs=null;P.band=mode!=='wait'&&settings.drums&&!!(flow&&flow.band);
  P.running=true;hideDlg();setStatsUI();
}
function hint(t,ms){const h=$('#hint');h.textContent=t;h.style.opacity=1;clearTimeout(hint._t);hint._t=setTimeout(()=>h.style.opacity=0,ms)}
function feedback(t,col){const f=$('#fb');f.textContent=t;f.style.color=col||'var(--paperInk)';f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}
function setStatsUI(){const s=P.stats||{combo:0,wrong:0};$('#cCombo').textContent=s.combo;$('#cWrong').textContent=s.wrong}
function setProg(p){$('#pProg').style.width=(Math.max(0,Math.min(1,p))*100).toFixed(1)+'%'}

function winBeats(){return Math.max(0.16,0.2*P.bps)}
function loop(now){
  P.raf=requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-P.last)/1000);P.last=now;
  if(P.running){
    const pc=P.piece;
    if(P.mode==='wait'){
      const st=P.steps[P.si];const target=st?st.t:pc.len;
      P.viewT+=(target-P.viewT)*(1-Math.exp(-dt*9));
      if(target-P.viewT<0.004)P.viewT=target;
      const limit=st?st.t-1e-4:Infinity;
      for(const n of P.notes)if(n.auto&&n.state==='pending'&&n.t<limit&&n.t<=P.viewT+0.03)playAuto(n);
      setProg(P.steps.length?P.si/P.steps.length:1);
      if(!st&&P.viewT>=pc.len-0.08)finishRun();
      if(stats&&P.mode!=='listen'){stats.seconds+=dt;stats.todaySec+=dt}
    }else{
      P.viewT=(now-P.t0)/1000*P.bps-P.countIn;
      if(P.band&&P.viewT>=0&&P.viewT<pc.len){const h=Math.floor(P.viewT*2+1e-6);if(h>P.lastHalf){P.lastHalf=h;playBeat(h,pc)}}
      const w=winBeats();
      for(const n of P.notes){
        if(n.state!=='pending')continue;
        if(n.auto){if(n.t<=P.viewT)playAuto(n)}
        else if(P.viewT>n.t+w){n.state='miss';P.stats.combo=0;setStatsUI()}
      }
      setProg(P.viewT/pc.len);
      if(P.mode==='tempo'){stats.seconds+=dt;stats.todaySec+=dt}
      if(P.viewT>=pc.len+0.6)finishRun();
    }
    updateTargets();
  }
  drawSheet(now);
}
function playBeat(h,pc){const ts=pc.ts,pos=(((h/2-pc.pickup)%ts)+ts)%ts,on=Math.abs(pos-Math.round(pos))<1e-6;
  if(ts===4){if(pos===0||pos===2)Synth.drum('kick');if(pos===1||pos===3)Synth.drum('snare',0.8)}
  else if(ts===3){if(pos===0)Synth.drum('kick');else if(on)Synth.drum('snare',0.35)}
  else if(ts===2){if(pos===0)Synth.drum('kick');if(pos===1)Synth.drum('snare',0.8)}
  Synth.drum('hat',on?0.8:0.45)}
function playAuto(n){n.state='auto';const sec=n.d/P.bps;Mic.mute(n.midi,sec*1000+350);Synth.noteOn(n.midi,P.mode==='listen'?0.8:0.55,Math.max(0.15,sec*0.95));
  keyClass(n.midi,'auto',true);setTimeout(()=>keyClass(n.midi,'auto',false),Math.max(120,sec*900))}

function judge(m,mic){
  if(!P.running||P.mode==='listen')return;
  const now=performance.now();
  const match=x=>x.midi===m||(mic&&x.midi%12===m%12);
  if(P.mode==='wait'){
    const st=P.steps[P.si];if(!st)return;
    // wait after every accepted note: short pause + playhead must reach the next note
    const gap=mic?settings.gapMs:Math.min(settings.gapMs,150);
    const samePc=P.lastPcs&&P.lastPcs.includes(m%12);
    if(now-P.lastAcceptAt<(mic&&samePc?gap*1.2:gap))return;
    if(Math.abs(P.viewT-st.t)>0.25)return;
    const n=st.notes.find(x=>match(x)&&x.state==='pending');
    if(n){if(mic)st.notes.forEach(x=>{if(x.state==='pending'){x.state='hit';x.hitAt=now;flashKey(x.midi,'good')}});else{n.state='hit';n.hitAt=now;flashKey(m,'good')}
      if(st.notes.every(x=>x.state==='hit')){
        if(st.clean){P.stats.clean++;P.stats.combo++;P.stats.best=Math.max(P.stats.best,P.stats.combo);comboFb()}else P.stats.combo=0;
        P.lastAcceptAt=now;P.lastPcs=st.notes.map(x=>x.midi%12);P.si++}}
    else if(!st.notes.some(match)){st.clean=false;wrong(m,now)}
  }else{
    const w=winBeats();let best=null,bd=1e9;
    for(const n of P.notes){if(n.auto||n.state!=='pending'||!match(n))continue;const d=Math.abs(n.t-P.viewT);if(d<=w&&d<bd){bd=d;best=n}}
    if(best){best.state='hit';best.hitAt=now;P.stats.hit++;P.stats.combo++;P.stats.best=Math.max(P.stats.best,P.stats.combo);flashKey(best.midi,'good');
      if(mic)for(const n of P.notes)if(!n.auto&&n.state==='pending'&&Math.abs(n.t-best.t)<1e-4){n.state='hit';n.hitAt=now;P.stats.hit++;flashKey(n.midi,'good')}
      const off=(P.viewT-best.t)/P.bps;
      if(P.stats.combo%5===0)comboFb();else if(Math.abs(off)<0.07)feedback('Idealnie!','#1f9a6b');else if(off<-0.14)feedback('Za wcześnie','#d98a10');else if(off>0.14)feedback('Za późno','#d98a10')}
    else wrong(m,now);
  }
  setStatsUI();
}
function wrong(m,now){P.stats.wrong++;P.stats.combo=0;flashKey(m,'bad');P.ghosts.push({...midiSpell(m),at:now,t:P.viewT})}
function comboFb(){const c=P.stats.combo;if(c>0&&c%5===0)feedback(c>=20?`Niesamowite! ×${c}`:c>=10?`Świetna seria ×${c}`:`Seria ×${c}`,'#e0532f')}

function finishRun(){
  P.running=false;const s=P.stats;
  if(P.mode==='listen'){showIntro();return}
  let acc=P.mode==='wait'?(s.total?s.clean/s.total:1):(s.total?s.hit/(s.total+0.5*s.wrong):1);
  acc=Math.max(0,Math.min(1,acc));
  const stars=acc>=0.9?3:acc>=0.72?2:acc>=0.5?1:0;
  if(stars>0)markPractice();store.set('stats',stats);
  showResults({acc,stars});
}

/* ---------- canvas ---------- */
function resize(){
  const r=cv.getBoundingClientRect();dpr=Math.min(3,window.devicePixelRatio||1);cw=r.width;ch=r.height;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);computeLayout();
  if(P.piece)layoutKeyboard();
}
function computeLayout(){
  if(!P.piece)return;const pc=P.piece,hasT=pc.hands.R,hasB=pc.hands.L,both=hasT&&hasB;
  let s=both?ch/22:ch/13;s=Math.max(6.5,Math.min(both?14:18,s));
  const lab=settings.names!=='off';
  let tb=0,bb=0;
  if(both){const top=(ch-14*s)/2+(lab?0:0);tb=top+4*s;bb=tb+10*s}
  else if(hasT){tb=(ch-4*s)/2+4*s+(lab?s*0.8:0)}
  else{bb=(ch-4*s)/2+4*s-(lab?s*0.8:0)}
  const minD=Math.min(1,...pc.notes.map(n=>n.d));
  const ppb=Math.max(s*5.2,s*3.4/minD);
  P.lay={s,tb,bb,hasT,hasB,both,ppb,px:Math.max(s*8,cw*0.27),clefW:s*4.4};
}
const yT=d=>P.lay.tb-(d-30)*P.lay.s/2, yB=d=>P.lay.bb-(d-18)*P.lay.s/2;
function staffOf(n){const L=P.lay;if(L.both)return n.hand?(n.hand==='R'?'T':'B'):(n.midi>=60?'T':'B');return L.hasT?'T':'B'}
function yOf(n,st){return st==='T'?yT(n.dia):yB(n.dia)}
const COL={ink:'#1d1b36',R:'#2f6cf0',L:'#e98510',hit:'#1fae76',miss:'#f0425f',auto:'#aaa6c8'};
function noteColor(n){
  if(n.state==='hit')return COL.hit;if(n.state==='miss')return COL.miss;if(n.auto)return COL.auto;
  if(P.running&&isCurrent(n))return COL[n.hand];return COL.ink}
function isCurrent(n){if(P.mode==='wait'){const st=P.steps[P.si];return st&&st.notes.includes(n)}return Math.abs(n.t-P.viewT)<=winBeats()+0.15}

function drawSheet(now){
  const g=g2;g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#fbf8f1';g.fillRect(0,0,cw,ch);
  const L=P.lay;if(!L)return;const s=L.s,pc=P.piece,vt=P.viewT;
  const X=t=>L.px+(t-vt)*L.ppb;
  // playhead band
  g.fillStyle='rgba(79,134,255,.09)';g.fillRect(L.px-s*1.3,0,s*2.6,ch);
  {const t0=(L.hasT?L.tb-4*s:L.bb-4*s)-s*2,b0=(L.hasB?L.bb:L.tb)+s*2;g.fillStyle='rgba(47,108,240,.35)';g.fillRect(L.px-1,t0,2,b0-t0)}
  // staff lines
  const staffLines=(base)=>{for(let i=0;i<5;i++){const y=base-i*s;g.beginPath();g.moveTo(0,y);g.lineTo(cw,y);g.stroke()}};
  g.strokeStyle='rgba(29,27,54,.55)';g.lineWidth=1;
  if(L.hasT)staffLines(L.tb);if(L.hasB)staffLines(L.bb);
  const top=L.hasT?L.tb-4*s:L.bb-4*s,bot=L.hasB?L.bb:L.tb;
  // barlines
  g.strokeStyle='rgba(29,27,54,.45)';g.lineWidth=1.2;
  for(let b=pc.pickup>0?pc.pickup:pc.ts;b<=pc.len+1e-6;b+=pc.ts){const x=X(b)-s*1.1;if(x<-5||x>cw+5)continue;g.beginPath();g.moveTo(x,top);g.lineTo(x,bot);g.stroke()}
  {const x=X(pc.len)+s*0.4;if(x<cw+10){g.lineWidth=1.2;g.beginPath();g.moveTo(x,top);g.lineTo(x,bot);g.stroke();g.lineWidth=4;g.beginPath();g.moveTo(x+5,top);g.lineTo(x+5,bot);g.stroke()}}
  // notes
  const lab=settings.names!=='off';
  for(const grp of P.groups){
    const n0=grp[0];const x=X(n0.t);if(x<-4*s||x>cw+4*s)continue;
    const st=staffOf(n0);const d=n0.d;
    const hollow=d>=2,stemmed=d<4,dotted=[3,1.5,0.75].includes(d),flags=d<=0.25?2:d<=0.5||d===0.75?1:0;
    const ys=grp.map(n=>yOf(n,st));
    const mid=st==='T'?34:22;const avg=grp.reduce((a,n)=>a+n.dia,0)/grp.length;const up=avg<mid;
    const col=noteColor(n0);
    // ledger lines
    g.strokeStyle='rgba(29,27,54,.7)';g.lineWidth=1.2;
    for(const n of grp){const lines=[];
      if(st==='T'){if(n.dia<=28)for(let k=28;k>=n.dia;k-=2)lines.push(yT(k));if(n.dia>=40)for(let k=40;k<=n.dia;k+=2)lines.push(yT(k))}
      else{if(n.dia>=28)for(let k=28;k<=n.dia;k+=2)lines.push(yB(k));if(n.dia<=16)for(let k=16;k>=n.dia;k-=2)lines.push(yB(k))}
      for(const y of lines){g.beginPath();g.moveTo(x-s*1.05,y);g.lineTo(x+s*1.05,y);g.stroke()}}
    // stem
    if(stemmed){const sx=up?x+s*0.56:x-s*0.56;const y1=up?Math.max(...ys):Math.min(...ys);const y2=up?Math.min(...ys)-s*3.4:Math.max(...ys)+s*3.4;
      g.strokeStyle=col;g.lineWidth=Math.max(1.3,s*0.12);g.beginPath();g.moveTo(sx,y1);g.lineTo(sx,y2);g.stroke();
      for(let f=0;f<flags;f++){const fy=y2+(up?f*s*0.9:-f*s*0.9);g.beginPath();g.moveTo(sx,fy);

    // heads
    grp.forEach((n,i)=>{const y=ys[i];const c=noteColor(n);
      // second interval offset
      let hx=x;if(i>0&&Math.abs(n.dia-grp[i-1].dia)===1&&!grp[i-1]._off){hx=x+(up?s*1.1:-s*1.1);n._off=true}else n._off=false;

    });

    if(lab){g.font=`800 ${Math.max(10,s*0.98)}px Nunito,sans-serif`;g.textAlign='center';g.textBaseline='middle';
      const sorted=[...grp].sort((a,b)=>b.dia-a.dia);
      sorted.forEach((n,i)=>{g.fillStyle=noteColor(n)===COL.ink?'#6b6890':noteColor(n);
        let y;if(st==='T')y=L.tb-(L.both?7.3:6.6)*s-i*s*1.15;

  }
  // ghost wrong notes
  P.ghosts=P.ghosts.filter(gh=>now-gh.at<700);
  for(const gh of P.ghosts){const k=(now-gh.at)/700;const st=staffOf({midi:gh.midi});const y=yOf(gh,st);const x=L.px;
    g.globalAlpha=1-k;g.fillStyle=COL.miss;g.save();g.translate(x,y);g.rotate(-0.38);g.beginPath();g.ellipse(0,0,s*0.64,s*0.45,0,0,Math.PI*2);g.fill();g.restore();
    g.strokeStyle=COL.miss;g.lineWidth=1.2;
    const lines=[];if(st==='T'){if(gh.dia<=28)for(let q=28;q>=gh.dia;q-=2)lines.push(yT(q));if(gh.dia>=40)for(let q=40;q<=gh.dia;q+=2)lines.push(yT(q))}else{if(gh.dia>=28)for(let q=28;q<=gh.dia;q+=2)lines.push(yB(q));if(gh.dia<=16)for(let q=16;q>=gh.dia;q-=2)lines.push(yB(q))}
    for(const yy of lines){g.beginPath();g.moveTo(x-s*1.05,yy);g.lineTo(x+s*1.05,yy);g.stroke()}
    if(gh.acc>0){g.font=`${s*1.7}px "Noto Music",serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('♯',x-s*1.55,y)}
    g.globalAlpha=1}
  // clef panel
  const cwid=L.clefW;g.fillStyle='#fbf8f1';g.fillRect(0,0,cwid,ch);
  const gr=g.createLinearGradient(cwid,0,cwid+s*3,0);gr.addColorStop(0,'rgba(251,248,241,1)');gr.addColorStop(1,'rgba(251,248,241,0)');g.fillStyle=gr;g.fillRect(cwid,0,s*3,ch);
  g.strokeStyle='rgba(29,27,54,.55)';g.lineWidth=1;
  const part=(base)=>{for(let i=0;i<5;i++){const y=base-i*s;g.beginPath();g.moveTo(0,y);g.lineTo(cwid+s*3,y);g.stroke()}};
  if(L.hasT)part(L.tb);if(L.hasB)part(L.bb);
  g.fillStyle='#1d1b36';g.textAlign='left';g.textBaseline='alphabetic';
  if(L.hasT){g.font=`${s*5.7}px "Noto Music",serif`;g.fillText('𝄞',s*0.45,L.tb-s*0.46)}
  if(L.hasB){g.font=`${s*5.2}px "Noto Music",serif`;g.fillText('𝄢',s*0.6,L.bb)}

  if(P.running&&P.mode!=='wait'&&vt<0){const n=Math.ceil(-vt);g.fillStyle='rgba(29,27,54,.85)';g.font=`800 ${s*5}px "Baloo 2",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(String(n),cw/2,ch/2)}
}

    if(cmd===0x90&&vel>0){Mic.mute(note,1500);if(settings.midiSound){Synth.ensure();Synth.noteOn(note,0.4+vel/200)}keyClass(note,'dn',true);

    else if(cmd===0x80||(cmd===0x90&&vel===0)){Synth.noteOff(note);keyClass(note,'dn',false)}}});
  midiCount=n;$('#midiTag').innerHTML=n?'<span class="midiTag">● MIDI</span>':'';const t=$('#midiStat');if(t)t.textContent=midiText();return n}

  const all=allLessons();const idx=all.findIndex(x=>x.l.id===id);const nx=all[idx+1];
  showDlg(`<div class="center"><div style="font-size:54px">🏆</div><div class="kick">${flow.c.title}</div><h2>Lekcja ukończona!</h2>
   <div class="bigStars" id="bs">${[0,1,2].map(()=>'<span>⭐</span>').join('')}</div>
   <p>${nx?`Następna: <b>${nx.l.title}</b>`:'Ukończyłeś wszystkie kursy! Czas na utwory.'}</p></div>
   <div class="btns"><button class="btn ghost" id="lBack">Wróć</button>${nx?'<button class="btn good" id="lNext">Następna ›</button>':''}</div>`);
  [...$('#bs').children].forEach((e,i)=>{if(i<st)setTimeout(()=>e.classList.add('on'),200+i*220)});
  [60,64,67,72].forEach((m,i)=>setTimeout(()=>Synth.noteOn(m,0.5,0.6),i*110));
  $('#lBack').onclick=()=>{homeView=flow.c.id;closePlayer()};
  if(nx)$('#lNext').onclick=()=>openLesson(nx.c,nx.l);
}


/* =========================================================
   MICROPHONE – pitch detection (YIN)
   ========================================================= */
function yin(buf,sr){
  const W=buf.length>>1,d=new Float32Array(W);
  const minT=Math.max(2,Math.floor(sr/2200)),maxT=Math.min(W-2,Math.floor(sr/62));
  for(let t=1;t<=maxT+1;t++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+t];s+=x*x}d[t]=s}
  let run=0;d[0]=1;for(let t=1;t<=maxT+1;t++){run+=d[t];d[t]=run?d[t]*t/run:1}
  let tau=-1;for(let t=minT;t<maxT;t++){if(d[t]<0.18){while(t+1<maxT&&d[t+1]<d[t])t++;tau=t;break}}
  if(tau<0)return null;
  const a=d[tau-1],b=d[tau],c=d[tau+1],den=a+c-2*b,sh=den?0.5*(a-c)/den:0;
  return{f:sr/(tau+sh),conf:1-b};
}
const Mic={on:false,state:'off',err:'',stream:null,an:null,buf:null,sr:48000,raf:0,lastTick:0,level:0,noise:0.003,
  cur:null,cand:null,candN:0,trough:9,peak:0,lastAt:0,heard:null,muted:{},
  statusText(){return this.state==='on'?'Słucham…':this.state==='err'?this.err:'Wyłączony – grasz na ekranie'},
  async start(){
    const md=navigator.mediaDevices;
    if(!md||!md.getUserMedia){return this.fail('Mikrofon jest tu zablokowany (podgląd na claude.ai na niego nie pozwala).')}
    try{
      Synth.ensure();
      const st=await md.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
      const c=Synth.ctx;this.stream=st;this.sr=c.sampleRate;
      const src=c.createMediaStreamSource(st),an=c.createAnalyser();an.fftSize=2048;src.connect(an);
      this.src=src;this.an=an;this.buf=new Float32Array(an.fftSize);
      this.on=true;this.state='on';this.err='';this.cur=null;cancelAnimationFrame(this.raf);this.raf=requestAnimationFrame(t=>this.tick(t));
      updateMicUI();return true;
    }catch(e){
      const n=e&&e.name;return this.fail(n==='NotAllowedError'||n==='SecurityError'?'Brak zgody na mikrofon (albo blokuje go podgląd na claude.ai).':n==='NotFoundError'?'Nie znaleziono mikrofonu w tym urządzeniu.':n==='NotReadableError'?'Mikrofon jest zajęty przez inną aplikację.':'Nie udało się włączyć mikrofonu.');
    }},
  stop(){cancelAnimationFrame(this.raf);try{this.stream&&this.stream.getTracks().forEach(t=>t.stop())}catch(e){}
    try{this.src&&this.src.disconnect()}catch(e){}
    if(this.cur!=null)this.off(this.cur);this.on=false;this.state='off';this.an=null;updateMicUI()},
  fail(msg){this.on=false;this.state='err';this.err=msg;updateMicUI();return false},
  mute(m,ms){const pc=m%12,u=performance.now()+ms;if(!this.muted[pc]||this.muted[pc]<u||ms<5000)this.muted[pc]=u},
  isMuted(m){return (this.muted[m%12]||0)>performance.now()},
  tick(now){
    if(!this.on)return;this.raf=requestAnimationFrame(t=>this.tick(t));
    if(now-this.lastTick<28)return;this.lastTick=now;
    const b=this.buf;this.an.getFloatTimeDomainData(b);
    let r=0;for(let i=0;i<b.length;i++)r+=b[i]*b[i];r=Math.sqrt(r/b.length);this.level=r;
    if(r<this.noise*2.5)this.noise=this.noise*0.97+r*0.03;
    const th=Math.max(0.0035,this.noise*3)/(settings.sens||1.4);
    if(r<th){if(this.cur!=null){this.off(this.cur);this.cur=null}this.cand=null;this.trough=Math.min(this.trough,r);this.ui(null);return}
    this.trough=Math.min(this.trough,r);
    const p=yin(b,this.sr);if(!p||p.conf<0.82){this.ui(this.cur);return}
    const m=Math.round(69+12*Math.log2(p.f/440));if(m<24||m>108)return;
    if(m===this.cand)this.candN++;else{this.cand=m;this.candN=1}
    if(this.candN<2){this.ui(this.cur);return}
    // same note counts again only after a real new key strike: level must have dropped and then jumped back up
    const onset=m===this.cur&&r>this.trough*1.8&&this.trough<this.peak*0.7&&now-this.lastAt>180;
    if(m!==this.cur||onset){if(this.cur!=null)this.off(this.cur);this.cur=m;this.lastAt=now;this.peak=r;this.trough=r;this.on_(m)}
    else if(r>this.peak){this.peak=r;this.trough=r}else this.trough=Math.min(this.trough,r);
    this.ui(m);
  },
  on_(m){this.heard=m;if(this.isMuted(m))return;onbHeard(m);
    if($('#player').classList.contains('on')){keyClass(m,'dn',true);stats.notes++;judge(m,true)}},
  off(m){keyClass(m,'dn',false)},
  ui(m){const lv=Math.min(1,this.level*12);
    const b=$('#pMic');if(b)b.style.setProperty('--lvl',lv.toFixed(2));
    const n=$('#micNote');if(n){n.textContent=m==null?'–':noteLabel(midiSpell(m))+(Math.floor(m/12)-1);$('#micLvl').style.width=(lv*100)+'%'}
    const o=$('#onbLvl');if(o)o.style.width=(lv*100)+'%'}
};
function updateMicUI(){const b=$('#pMic');if(b){b.classList.toggle('on',Mic.on);b.classList.toggle('err',Mic.state==='err')}
  const s=$('#micStat');if(s)s.textContent=Mic.statusText();const t=$('#micTog');if(t)t.classList.toggle('on',Mic.on)}
function micHelp(){const c=$('#confirm');$('#confirmCard').innerHTML=`<div style="font-size:40px">🎤</div><h2>Mikrofon niedostępny</h2><p>${Mic.err}</p>
  <p>Podgląd aplikacji na claude.ai działa w zabezpieczonej ramce, która nie pozwala na mikrofon. Pobierz plik aplikacji i otwórz go bezpośrednio:</p>
  <p>• <b>Komputer:</b> otwórz plik w Chrome, zezwól na mikrofon i postaw laptopa przy pianinie.<br>• <b>Telefon:</b> wgraj plik na dowolny hosting https (np. GitHub Pages, Netlify) i otwórz link w Safari lub Chrome.</p>
  <p>Do tego czasu grasz na klawiaturze na ekranie.</p><div class="btns"><button class="btn" id="cfY">Rozumiem</button></div>`;
  c.classList.add('on');$('#cfY').onclick=()=>c.classList.remove('on')}
$('#pMic').onclick=async()=>{if(Mic.on){Mic.stop();settings.mic=false}else{const ok=await Mic.start();settings.mic=ok;if(!ok)micHelp()}saveSettings()};

/* =========================================================
   ONBOARDING (first launch)
   ========================================================= */
let onbI=0,onbHeardOk=false;
function showOnb(i){onbI=i||0;$('#onb').classList.add('on');renderOnb()}
function onbHeard(m){if(!$('#onb').classList.contains('on'))return;const e=$('#onbNote');if(e){e.textContent=noteLabel(midiSpell(m))+(Math.floor(m/12)-1);onbHeardOk=true;const ok=$('#onbOk');if(ok){ok.textContent='Słyszę Cię! 🎉';ok.style.color='var(--good)'};const c=$('#onbConn');if(c)c.style.display='none';const u=$('#onbUseMic');if(u)u.style.display='none';const n=$('#onbNext');if(n)n.disabled=false}}
function renderOnb(){
  const steps=5;const dots=`<div class="dots">${Array.from({length:steps},(_,k)=>`<i class="${k<=onbI?'on':''}"></i>`).join('')}</div>`;
  const ch=(key,opts)=>opts.map(([v,ic,t,d])=>`<button class="choice ${String(settings[key])===String(v)?'sel':''}" data-k="${key}" data-v="${v}"><span class="ci">${ic}</span><span><b>${t}</b><small>${d}</small></span></button>`).join('');
  let body='',foot='';
  if(onbI===0){body=`<div class="em">🎹</div><h1>Witaj w Nutce!</h1><p>Naucz się grać na pianinie w kilka minut dziennie. Krok po kroku, z gwiazdkami i natychmiastową oceną.</p>`;
    foot=`<button class="btn block" data-go="1">Zaczynamy</button>`}
  else if(onbI===1){body=`<h1>Na czym będziesz grać?</h1><p>Dopasujemy sposób słuchania Twojej gry.</p>${ch('instrument',[['acoustic','🎹','Pianino akustyczne','Aplikacja posłucha przez mikrofon'],['digital','🎛️','Keyboard / pianino cyfrowe','Kabel USB (MIDI) albo mikrofon'],['screen','📱','Nie mam instrumentu','Graj na klawiaturze na ekranie']])}`}
  else if(onbI===2){body=`<h1>Ile już umiesz?</h1><p>Zaczniesz od właściwego miejsca.</p>${ch('level',[['zero','🌱','Zaczynam od zera','Nigdy nie grałem/am'],['basics','🎵','Znam podstawy','Czytam proste nuty prawą ręką'],['some','🎼','Gram już trochę','Obie ręce, proste akordy']])}`}
  else if(onbI===3){body=`<h1>Twój cel dzienny</h1><p>Krótko, ale codziennie – tak najszybciej robi się postępy.</p>${ch('goalMin',[[5,'☕','5 minut','Na luzie'],[10,'🎯','10 minut','Regularnie'],[15,'🔥','15 minut','Poważnie'],[20,'🚀','20 minut','Intensywnie']])}`}
  else if(onbI===4){
    if(settings.instrument==='screen'){onbI=5;return renderOnb()}
    const dig=settings.instrument==='digital';
    body=`<div class="em">${dig?'🎛️':'🎤'}</div><h1>${dig?'Podłącz keyboard':'Pozwól Nutce słuchać'}</h1>
     <p>${dig?'Podłącz keyboard kablem USB i kliknij „Połącz”. Przeglądarka zapyta o dostęp do urządzeń MIDI – aplikacja tylko odczytuje, które klawisze naciskasz.':'Postaw telefon lub laptopa przy pianinie. Przeglądarka zapyta o mikrofon – dźwięk jest analizowany tylko na Twoim urządzeniu.'}</p>
     <div class="heard"><b id="onbNote">–</b><div class="bar"><i id="onbLvl" style="width:0%"></i></div><span id="onbOk" style="font-weight:800;color:var(--mut)">${Mic.on||midiCount?'Zagraj dowolny klawisz…':''}</span></div>`;
    foot=`<button class="btn block" id="onbConn">${dig?'Połącz MIDI':'Włącz mikrofon'}</button>${dig?'<button class="btn ghost block" id="onbUseMic">Użyję mikrofonu</button>':''}<button class="btn good block" id="onbNext" ${onbHeardOk?'':'disabled'}>Dalej</button><button class="linkBtn" data-go="5">Pomiń – zagram na ekranie</button>`}
  else{const L=settings.level;
    body=`<div class="em">🎉</div><h1>Wszystko gotowe!</h1><p>${L==='zero'?'Zaczniemy od pierwszego dźwięku – C.':L==='basics'?'Proponujemy kurs „Obie ręce”.':'Wybierz utwór z biblioteki i graj po kawałku.'}<br>Cel: <b>${settings.goalMin} min</b> dziennie.</p>`;
    foot=`<button class="btn block" id="onbFin">${L==='zero'?'▶ Pierwsza lekcja':L==='basics'?'Przejdź do kursu':'Wybierz utwór'}</button>`}
  $('#onbIn').innerHTML=dots+`<div class="onbBody">${body}</div><div class="onbFoot">${foot}</div>`;
  $('#onbIn').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const k=b.dataset.k;settings[k]=k==='goalMin'?+b.dataset.v:b.dataset.v;saveSettings();onbI++;renderOnb()});
  $('#onbIn').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{onbI=+b.dataset.go;renderOnb()});
  const conn=$('#onbConn');if(conn)conn.onclick=async()=>{const ok=$('#onbOk');
    if(settings.instrument==='digital'&&conn.textContent.includes('MIDI')){const n=await connectMidi();ok.textContent=n>0?'Zagraj dowolny klawisz…':n===0?'Nie widzę keyboardu – sprawdź kabel i spróbuj ponownie.':'Przeglądarka nie dała dostępu do MIDI. Spróbuj mikrofonu.'}
    else{const r=await Mic.start();settings.mic=r;saveSettings();ok.textContent=r?'Zagraj dowolny klawisz…':Mic.err}};
  const um=$('#onbUseMic');if(um)um.onclick=async()=>{const r=await Mic.start();settings.mic=r;saveSettings();$('#onbOk').textContent=r?'Zagraj dowolny klawisz…':Mic.err};
  const nx=$('#onbNext');if(nx)nx.onclick=()=>{onbI=5;renderOnb()};
  const fin=$('#onbFin');if(fin)fin.onclick=()=>{settings.onboarded=true;saveSettings();$('#onb').classList.remove('on');const L=settings.level;
    if(L==='zero'){homeView=null;goTab('home');openLesson(COURSES[0],COURSES[0].lessons[0])}else if(L==='basics'){homeView='c3';goTab('home')}else goTab('songs')};
}
renderAll();
if(!settings.onboarded)showOnb(0);
if(settings.midi)connectMidi();
if(settings.mic){Mic.start().then(ok=>{if(!ok){settings.mic=false;saveSettings()}})}
try{document.fonts&&document.fonts.load('40px "Noto Music"','𝄞𝄢♯').catch(()=>{})}catch(e){}
</script>
